<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Code</title>
  <link rel="stylesheet" href="assets/fionviber-tool.css">
  <link rel="stylesheet" href="assets/locale.css">
</head>
<body>
  <main>
    <div class="title-row">
      <h1 id="tool-title" data-i18n="appTitle">QR Code</h1>
      <div class="asq-locale-field"><span class="sr-only" id="asq-lang-name" data-i18n="languageLabel">Language</span><select aria-labelledby="asq-lang-name" id="languageSelect">
          <option value="auto">Auto</option>
          <option value="en">English</option>
          <option value="zh-CN">Simplified Chinese</option>
          <option value="zh-TW">Traditional Chinese</option>
        </select></div>
    </div>

    <nav class="work-links" aria-labelledby="tool-title">
      <a href="#generatorTitle" data-i18n="generatorTitle">QR Code Generator</a>
      <a href="#decoderTitle" data-i18n="decoderTitle">QR Code Decoder</a>
    </nav>
    <section class="workspace">
      <section class="panel generator" aria-labelledby="generatorTitle">
        <div class="panel-head">
          <h2 id="generatorTitle" tabindex="-1" data-i18n="generatorTitle">QR Code Generator</h2>
          <span id="textMeta" class="meta"></span>
        </div>
        <div class="generator-body">
          <div class="input-column">
            <label class="field-label" for="textInput" data-i18n="textInputLabel">Enter text</label>
            <textarea id="textInput" data-i18n-placeholder="textInputPlaceholder" placeholder="Enter text"></textarea>
            <div class="actions generate-actions">
              <label class="sr-only" for="sizeSelect" data-i18n="sizeLabel">Size</label>
              <select id="sizeSelect">
                <option value="300">300 px</option>
                <option value="400" selected>400 px</option>
                <option value="600">600 px</option>
                <option value="800">800 px</option>
              </select>
              <button id="generateBtn" type="button" data-i18n="generateButton">Generate QR Code</button>
              <button id="clearTextBtn" class="secondary clear-text" type="button" aria-label="Clear text" title="Clear text" data-i18n-aria-label="clearTextLabel" data-i18n-title="clearTextLabel">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true" focusable="false"><path d="m6 6 12 12M18 6 6 18"/></svg>
              </button>
            </div>
            <div id="generateStatus" class="status"></div>
          </div>

          <div class="preview-column">
            <span class="field-label" data-i18n="generatedResultLabel">Generated QR Code</span>
            <div class="qr-stage">
              <canvas id="qrCanvas" width="400" height="400"></canvas>
              <div id="qrEmpty" class="empty" data-i18n="qrEmpty">Waiting to generate</div>
            </div>
            <div class="actions">
              <a id="downloadPng" class="download-link secondary" href="#" download="qrcode.png" aria-disabled="true" data-i18n="downloadImage">Download Image</a>
              <button id="copyPngBtn" class="secondary" type="button" data-i18n="copyImage">Copy Image</button>
            </div>
          </div>
        </div>
      </section>

      <section class="panel decoder" aria-labelledby="decoderTitle">
        <div class="panel-head">
          <h2 id="decoderTitle" tabindex="-1" data-i18n="decoderTitle">QR Code Decoder</h2>
        </div>
        <div class="decoder-body">
          <label class="dropzone" id="dropzone" for="fileInput">
            <input class="sr-only" id="fileInput" type="file" accept="image/*" multiple>
            <span data-i18n="dropzoneText">Choose an image, or drop/paste one</span>
          </label>
          <div class="actions">
            <button id="pasteImageBtn" type="button" data-i18n="pasteImage">Paste Image</button>
          </div>
          <div id="imageStatus" role="status" class="status"></div>
        </div>
      </section>
    </section>

    <section class="records-section" data-i18n-aria-label="recordsAriaLabel" aria-label="Records">
        <section class="panel record-column" aria-labelledby="generationRecordsTitle">
          <div class="record-head">
            <h2 id="generationRecordsTitle" data-i18n="generationRecordsTitle">Generation History</h2>
            <div class="actions">
              <button id="clearGenerationRecordsBtn" class="secondary" type="button" data-i18n="clearButton">Clear</button>
            </div>
          </div>
          <div id="generationRecordList" class="record-list">
            <div class="records-empty" data-i18n="noGenerationRecords">No generation history</div>
          </div>
        </section>

        <section class="panel record-column" aria-labelledby="decodeRecordsTitle">
          <div class="record-head">
            <h2 id="decodeRecordsTitle" data-i18n="decodeRecordsTitle">Decode Results</h2>
            <div class="actions">
              <button id="copyAllDecodeBtn" class="secondary" type="button" data-i18n="copyAllButton">Copy All</button>
              <button id="clearDecodeRecordsBtn" class="secondary" type="button" data-i18n="clearButton">Clear</button>
            </div>
          </div>
          <div id="decodeRecordList" class="record-list">
            <div class="records-empty" data-i18n="noDecodeRecords">No decode results</div>
          </div>
        </section>
    </section>

    <footer class="site-footer">
      <a class="footer-link" href="https://github.com/FionViber/QRCode" target="_blank" rel="noopener" data-i18n="githubLink">GitHub Project</a>
      <span class="footer-separator" aria-hidden="true">·</span>
      <span data-i18n="creditLabel">Credit</span>
      <a class="footer-link" href="https://github.com/FionViber" target="_blank" rel="noopener">FionViber</a>
    </footer>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" aria-atomic="true"></div>

  <script src="vendor/zxing-browser.min.js"></script>
  <script src="app.js"></script>
  <script src="assets/locale-picker.js"></script>
</body>
</html>
